<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand">WhatsApp Admin</div>
        <nav>
          <a class="nav-link" href="/dashboard">Dashboard</a>
          <a class="nav-link" href="/contacts">Contacts</a>
          <a class="nav-link" href="/campaigns">Campaigns</a>
          <a class="nav-link active" href="/messages">Messages</a>
          <a class="nav-link" href="/templates">Templates</a>
          <button id="logoutButton" class="logout-btn" type="button">Logout</button>
        </nav>
      </aside>
      <main class="content">
        <header class="topbar">
          <h2>Messages</h2>
          <div id="userBadge" class="user-badge">Loading...</div>
        </header>
        <section class="panel">
          <div class="toolbar">
            <input id="messageSearch" type="search" placeholder="Search messages" />
            <select id="messageStatusFilter">
              <option value="">All statuses</option>
              <option value="sent">Sent</option>
              <option value="delivered">Delivered</option>
              <option value="read">Read</option>
              <option value="failed">Failed</option>
            </select>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Phone</th>
                  <th>Contact</th>
                  <th>Campaign</th>
                  <th>Template</th>
                  <th>Message ID</th>
                  <th>Status</th>
                  <th>Error</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="messagesTableBody"></tbody>
            </table>
          </div>
          <div class="pager" id="messagesPager"></div>
        </section>
      </main>
    </div>
    <script src="/js/auth.js"></script>
    <script src="/js/messages.js"></script>
  </body>
</html>
