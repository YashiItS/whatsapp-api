<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaigns</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand">WhatsApp Admin</div>
        <nav>
          <a class="nav-link" href="/dashboard">Dashboard</a>
          <a class="nav-link" href="/contacts">Contacts</a>
          <a class="nav-link active" href="/campaigns">Campaigns</a>
          <a class="nav-link" href="/messages">Messages</a>
          <a class="nav-link" href="/templates">Templates</a>
          <button id="logoutButton" class="logout-btn" type="button">Logout</button>
        </nav>
      </aside>
      <main class="content">
        <header class="topbar">
          <h2>Campaigns</h2>
          <div id="userBadge" class="user-badge">Loading...</div>
        </header>
        <section class="panel">
          <form id="campaignForm" class="form-grid">
            <input id="campaignName" placeholder="Campaign Name" required />
            <select id="campaignTemplate"></select>
            <select id="campaignLanguage">
              <option value="en_US">en_US</option>
            </select>
            <button type="submit">Create Campaign</button>
          </form>
          <div id="campaignPreview" class="preview-box"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Template</th>
                  <th>Language</th>
                  <th>Status</th>
                  <th>Contacts</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="campaignsTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script src="/js/auth.js"></script>
    <script src="/js/campaigns.js"></script>
  </body>
</html>
