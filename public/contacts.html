<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacts</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand">WhatsApp Admin</div>
        <nav>
          <a class="nav-link" href="/dashboard">Dashboard</a>
          <a class="nav-link active" href="/contacts">Contacts</a>
          <a class="nav-link" href="/campaigns">Campaigns</a>
          <a class="nav-link" href="/messages">Messages</a>
          <a class="nav-link" href="/templates">Templates</a>
          <button id="logoutButton" class="logout-btn" type="button">Logout</button>
        </nav>
      </aside>
      <main class="content">
        <header class="topbar">
          <h2>Contacts</h2>
          <div id="userBadge" class="user-badge">Loading...</div>
        </header>
        <section class="panel">
          <div class="toolbar">
            <input id="contactSearch" type="search" placeholder="Search contacts" />
            <select id="contactStatusFilter">
              <option value="">All statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
            <button id="addContactButton" type="button">Add Contact</button>
            <button id="exportContactsButton" type="button" class="secondary">Export CSV</button>
          </div>
          <form id="contactForm" class="form-grid hidden">
            <input type="hidden" id="contactId" />
            <input id="contactName" placeholder="Name" />
            <input id="contactPhone" placeholder="Phone (international format)" />
            <input id="contactEmail" type="email" placeholder="Email" />
            <input id="contactTags" placeholder="Tags, comma separated" />
            <select id="contactStatus">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
            <button type="submit">Save</button>
            <button type="button" class="secondary" id="cancelContactEdit">Cancel</button>
          </form>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th><input type="checkbox" id="selectAllContacts" /></th>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Email</th>
                  <th>Tags</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="contactsTableBody"></tbody>
            </table>
          </div>
          <div class="pager" id="contactsPager"></div>
        </section>
      </main>
    </div>
    <script src="/js/auth.js"></script>
    <script src="/js/contacts.js"></script>
  </body>
</html>
